name: Compilar Mod Fabric
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: ./gradlew build || gradle build
      - uses: actions/upload-artifact@v3
        with:
          name: Mod-Minecraft
          path: build/libs/*.jar
